[package]
name = "eal-dioxus-web"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Dioxus SSR + Axum + WebSocket comparison server for Embedded Alerts."
repository = "https://github.com/embedded-alerts/eal-dioxus-web"
publish = false

[dependencies]
axum = { version = "0.8", features = ["ws"] }
dioxus = { version = "0.6", features = ["ssr"] }
dioxus-ssr = "0.6"
futures-util = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
