[package]
org = "embedded-alerts"
name = "eal-dioxus-web"
version = "0.1.0"
description = "Rust web server for Embedded Alerts"
license = "MIT"
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/embedded-alerts/eal-dioxus-web"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".env", ".env.*", "node_modules/**", ".vendor/.zed/**", "target/**", "dist/**", "*.log"]

[dependencies]
"embedded-alerts/eal-interfaces" = "^0.1.0"
"embedded-alerts/eal-libs" = "^0.1.0"

[install]
dir = ".vendor/.zed"
adapter = "rust"
